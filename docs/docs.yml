openapi: 3.0.1
info:
    title: Harpaviljongen API
    description: |
        API documentation for Harpaviljongen restaurant managing menus, opening hours, events, menu PDFs and site settings.

        **Authentication:** all GET endpoints are public. Every POST, PUT, PATCH and DELETE needs a login token.
        Call `POST /auth/login`, copy `data.token` from the response, click **Authorize** above and paste it.

        **Roles:** `admin` can do everything, including `/users`. `employee` can change content (menus, opening hours, pages) but gets 403 on `/users`.
    version: 1.0.0
    contact:
        name: API Support
        url: https://davidakerlind.com
servers:
    - url: https://harpaviljongen-db-api.onrender.com/api
      description: Production server
    - url: http://localhost:7000/api
      description: Development server

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Token from POST /auth/login

    schemas:
        ApiResponse:
            type: object
            properties:
                status:
                    type: integer
                    description: HTTP status code
                    example: 200
                message:
                    type: string
                    description: Human readable message
                    example: 'Operation successful'
                success:
                    type: boolean
                    description: Operation success status
                    example: true
                data:
                    description: Optional response data
                    oneOf:
                        - type: object
                        - type: array
                        - type: string
        MenuItem:
            type: object
            properties:
                id:
                    type: string
                    example: 'item-abc123'
                active:
                    type: boolean
                    example: true
                title:
                    type: string
                    example: 'Pasta Carbonara'
                description:
                    type: string
                    example: 'Fresh pasta with cream sauce'
                price:
                    oneOf:
                        - type: number
                        - type: string
                    example: 159
                producer:
                    type: string
                    description: 'Only for wine menu'
                    example: 'Château Margaux'
                createdAt:
                    type: string
                    format: date-time
                    example: '2025-05-28 14:30:00'
                updatedAt:
                    type: string
                    format: date-time
                    example: '2025-05-28 14:30:00'

        Menu:
            type: object
            properties:
                id:
                    type: string
                    example: 'menu-wine'
                title:
                    type: string
                    example: 'Wine Menu'
                description:
                    type: string
                    example: 'Our selection of fine wines'
                type:
                    type: string
                    enum: ['food', 'wine', 'drinks']
                    example: 'wine'
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/MenuItem'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        OpeningHours:
            type: object
            properties:
                day:
                    type: string
                    enum:
                        [
                            'Måndag',
                            'Tisdag',
                            'Onsdag',
                            'Torsdag',
                            'Fredag',
                            'Lördag',
                            'Söndag',
                        ]
                    example: 'Måndag'
                hours:
                    type: object
                    properties:
                        from:
                            type: string
                            pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$|^$'
                            example: '11:00'
                        to:
                            type: string
                            pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$|^$'
                            example: '22:00'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        Event:
            type: object
            properties:
                eventId:
                    type: string
                    example: 'evt-123abc'
                title:
                    type: string
                    example: 'DJ Night with DJ Example'
                shortDescription:
                    type: string
                    maxLength: 100
                    example: 'Dancing and cocktails all night!'
                longDescription:
                    type: string
                    example: 'Join us for an amazing night with our resident DJ playing the best house and disco music.'
                date:
                    type: string
                    format: date
                    example: '2025-06-14'
                startTime:
                    type: string
                    pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
                    example: '20:00'
                endTime:
                    type: string
                    pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
                    example: '01:00'
                type:
                    type: string
                    enum: ['dj', 'wine', 'private', 'other']
                    example: 'dj'
                image:
                    type: string
                    example: '/src/assets/pictures/event.png'
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        User:
            type: object
            description: The password is never returned.
            properties:
                userId:
                    type: string
                    example: 'f60d0'
                username:
                    type: string
                    example: 'anna'
                role:
                    type: string
                    enum: [admin, employee]
                    example: 'employee'
                createdAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: null for users created before roles existed

        CreateUserRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                    minLength: 3
                    maxLength: 30
                    pattern: '^[\p{L}\p{N}._-]+$'
                    description: Letters (å, ä, ö too), numbers, . _ or -. Must be unique, not case sensitive.
                    example: 'anna'
                password:
                    type: string
                    minLength: 8
                    maxLength: 72
                    example: 'hemligt123'
                role:
                    type: string
                    enum: [admin, employee]
                    default: employee

        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                    description: Not case sensitive
                    example: 'adminuser'
                password:
                    type: string
                    example: 'password123'

        CreateMenuRequest:
            type: object
            required:
                - id
                - title
                - type
            properties:
                id:
                    type: string
                    example: 'menu-food'
                title:
                    type: string
                    example: 'Food Menu'
                description:
                    type: string
                    example: 'Our delicious food selection'
                type:
                    type: string
                    enum: ['food', 'wine', 'drinks']
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/MenuItem'
                    default: []

        CreateMenuItemRequest:
            type: object
            required:
                - title
                - price
            properties:
                title:
                    type: string
                    example: 'Pasta Carbonara'
                description:
                    type: string
                    example: 'Fresh pasta with cream sauce'
                price:
                    oneOf:
                        - type: number
                        - type: string
                    example: 159
                producer:
                    type: string
                    description: 'Only for wine menu'

        CreateEventRequest:
            type: object
            required:
                - title
                - shortDescription
                - longDescription
                - date
                - startTime
                - endTime
                - type
            properties:
                title:
                    type: string
                shortDescription:
                    type: string
                    maxLength: 100
                longDescription:
                    type: string
                date:
                    type: string
                    format: date
                startTime:
                    type: string
                    pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
                endTime:
                    type: string
                    pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$'
                type:
                    type: string
                    enum: ['dj', 'wine', 'private', 'other']
                image:
                    type: string
                    default: '/src/assets/pictures/event.png'

        MenuPdf:
            type: object
            properties:
                _id:
                    type: string
                    example: '6ab52937e69f242f1c0f69b6'
                type:
                    type: string
                    enum: ['food', 'wine', 'lunch', 'drinks']
                    description: 'food = Meny, wine = Vinlista on the website'
                title:
                    type: string
                    example: 'Höstmeny 2026'
                originalName:
                    type: string
                    example: 'meny-host.pdf'
                bytes:
                    type: number
                    example: 245810
                url:
                    type: string
                    example: 'https://res.cloudinary.com/<cloud>/image/upload/v1/menu-pdfs/food-1790257463874.pdf'
                publicId:
                    type: string
                resourceType:
                    type: string
                    example: 'image'
                uploadedAt:
                    type: string
                    format: date-time
                isActive:
                    type: boolean
                    description: 'At most one active PDF per type. The active one is linked from the website.'

        PageVisibility:
            type: object
            properties:
                navbar:
                    type: boolean
                    description: Show the link in the navbar
                home:
                    type: boolean
                    description: Show the button on the homepage

        SiteSettings:
            type: object
            properties:
                key:
                    type: string
                    example: 'main'
                pages:
                    type: object
                    properties:
                        chambre:
                            $ref: '#/components/schemas/PageVisibility'
                        events:
                            $ref: '#/components/schemas/PageVisibility'
                        gallery:
                            $ref: '#/components/schemas/PageVisibility'

    responses:
        BadRequestError:
            description: Bad Request
            content:
                application/json:
                    schema:
                        allOf:
                            - $ref: '#/components/schemas/ApiResponse'
                            - type: object
                              properties:
                                  status:
                                      example: 400
                                  success:
                                      example: false
                                  message:
                                      example: 'Invalid input data'

        NotFoundError:
            description: Resource not found
            content:
                application/json:
                    schema:
                        allOf:
                            - $ref: '#/components/schemas/ApiResponse'
                            - type: object
                              properties:
                                  status:
                                      example: 404
                                  success:
                                      example: false
                                  message:
                                      example: 'Resource not found'

        ServerError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        allOf:
                            - $ref: '#/components/schemas/ApiResponse'
                            - type: object
                              properties:
                                  status:
                                      example: 500
                                  success:
                                      example: false
                                  message:
                                      example: 'Server error'

paths:
    # Menu Operations
    /menus:
        get:
            tags:
                - Menus
            summary: Get all menus
            description: Retrieve all restaurant menus
            responses:
                '200':
                    description: Menus retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Menu'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

        post:
            security:
                - bearerAuth: []
            tags:
                - Menus
            summary: Create a new menu
            description: Create a new restaurant menu
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateMenuRequest'
            responses:
                '201':
                    description: Menu created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Menu'
                '400':
                    $ref: '#/components/responses/BadRequestError'
                '500':
                    $ref: '#/components/responses/ServerError'

    /menus/search/items:
        get:
            tags:
                - Menus
            summary: Search menu items
            description: Search for menu items by query string
            parameters:
                - in: query
                  name: query
                  required: true
                  schema:
                      type: string
                  description: Search query
                  example: 'toast'
            responses:
                '200':
                    description: Search results retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'Found 1 items matching: \"toast\"'
                                          data:
                                              type: object
                                              properties:
                                                  menuId:
                                                      type: string
                                                      example: 'menu-wine'
                                                  menuTitle:
                                                      type: string
                                                      example: 'Wine Menu'
                                                  items:
                                                      type: array
                                                      items:
                                                          $ref: '#/components/schemas/MenuItem'

                '400':
                    $ref: '#/components/responses/BadRequestError'
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /menus/{menuId}:
        get:
            tags:
                - Menus
            summary: Get menu by ID
            parameters:
                - in: path
                  name: menuId
                  required: true
                  schema:
                      type: string
                  example: 'menu-wine'
            responses:
                '200':
                    description: Menu retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/Menu'
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /menus/{menuId}/items:
        get:
            tags:
                - Menus
            summary: Get menu items
            parameters:
                - in: path
                  name: menuId
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Menu items retrieved successfully
                '404':
                    $ref: '#/components/responses/NotFoundError'

        post:
            security:
                - bearerAuth: []
            tags:
                - Menus
            summary: Add menu item
            parameters:
                - in: path
                  name: menuId
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateMenuItemRequest'
            responses:
                '201':
                    description: Menu item added successfully
                '404':
                    $ref: '#/components/responses/NotFoundError'

    # Opening Hours Operations
    /openingHours:
        get:
            tags:
                - Opening Hours
            summary: Get all opening hours
            responses:
                '200':
                    description: Opening hours retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/OpeningHours'
                '404':
                    $ref: '#/components/responses/NotFoundError'

        post:
            security:
                - bearerAuth: []
            tags:
                - Opening Hours
            summary: Create opening hours
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - day
                                - hours
                            properties:
                                day:
                                    type: string
                                    enum:
                                        [
                                            'Måndag',
                                            'Tisdag',
                                            'Onsdag',
                                            'Torsdag',
                                            'Fredag',
                                            'Lördag',
                                            'Söndag',
                                        ]
                                hours:
                                    type: object
                                    properties:
                                        from:
                                            type: string
                                        to:
                                            type: string
            responses:
                '201':
                    description: Opening hours created successfully
                '400':
                    $ref: '#/components/responses/BadRequestError'

        put:
            security:
                - bearerAuth: []
            tags:
                - Opening Hours
            summary: Update several days at once
            description: |
                Empty from and to means closed. Days that don't exist yet are created.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - days
                            properties:
                                days:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/OpeningHours'
                        example:
                            days:
                                - day: 'Måndag'
                                  hours: { from: '', to: '' }
                                - day: 'Torsdag'
                                  hours: { from: '17:00', to: '00:00' }
            responses:
                '200':
                    description: All opening hours after the update, Monday first
                '400':
                    $ref: '#/components/responses/BadRequestError'

    /openingHours/day/{day}:
        put:
            security:
                - bearerAuth: []
            tags:
                - Opening Hours
            summary: Update opening hours by day
            parameters:
                - in: path
                  name: day
                  required: true
                  schema:
                      type: string
                      enum:
                          [
                              'Måndag',
                              'Tisdag',
                              'Onsdag',
                              'Torsdag',
                              'Fredag',
                              'Lördag',
                              'Söndag',
                          ]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                hours:
                                    type: object
                                    properties:
                                        from:
                                            type: string
                                        to:
                                            type: string
            responses:
                '200':
                    description: Opening hours updated successfully
                '404':
                    $ref: '#/components/responses/NotFoundError'

    # Event Operations
    /events:
        get:
            tags:
                - Events
            summary: Get all events
            responses:
                '200':
                    description: Events retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/Event'

        post:
            security:
                - bearerAuth: []
            tags:
                - Events
            summary: Create event
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateEventRequest'
            responses:
                '201':
                    description: Event created successfully

    /events/future:
        get:
            tags:
                - Events
            summary: Get future events
            responses:
                '200':
                    description: Future events retrieved successfully

    /events/{eventId}:
        get:
            tags:
                - Events
            summary: Get event by ID
            parameters:
                - in: path
                  name: eventId
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Event retrieved successfully
                '404':
                    $ref: '#/components/responses/NotFoundError'

        put:
            security:
                - bearerAuth: []
            tags:
                - Events
            summary: Update event
            parameters:
                - in: path
                  name: eventId
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Event'
            responses:
                '200':
                    description: Event updated successfully
                '404':
                    $ref: '#/components/responses/NotFoundError'

        delete:
            security:
                - bearerAuth: []
            tags:
                - Events
            summary: Delete event
            parameters:
                - in: path
                  name: eventId
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Event deleted successfully
                '404':
                    $ref: '#/components/responses/NotFoundError'

    # Authentication Operations
    /auth/login:
        post:
            tags:
                - Authentication
            summary: User login
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: User logged in successfully. Send data.token as `Authorization: Bearer <token>`.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: 'User logged in successfully'
                                    data:
                                        type: object
                                        properties:
                                            token:
                                                type: string
                                                example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
                                            user:
                                                type: object
                                                properties:
                                                    userId:
                                                        type: string
                                                        example: 'efe5a'
                                                    username:
                                                        type: string
                                                        example: 'adminuser'
                                                    role:
                                                        type: string
                                                        enum: [admin, employee]
                                                        example: 'admin'
                '429':
                    description: Too many login attempts (max 10 per 15 minutes)
                '401':
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          status:
                                              example: 401
                                          success:
                                              example: false
                                          message:
                                              example: 'Username or password are incorrect'

    /auth/logout:
        get:
            tags:
                - Authentication
            summary: User logout
            responses:
                '200':
                    description: User logged out successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          message:
                                              example: 'User logged out successfully'
    /auth/me:
        get:
            security:
                - bearerAuth: []
            tags:
                - Authentication
            summary: Check that a token is still valid
            description: Returns `{ user: { userId, username, role } }`. Also 401 if the account has been deleted.
            responses:
                '200':
                    description: Token is valid
                '401':
                    description: Missing, invalid or expired token

    /auth/register:
        post:
            security:
                - bearerAuth: []
            tags:
                - Authentication
            summary: Register new user (admins only, same as POST /users)
            description: The first user is created from the command line with `npm run create-user -- <username> <password>`.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                '201':
                    description: User created
                '400':
                    description: Validation error
                '403':
                    description: Logged in, but not an admin
                '409':
                    description: Username already exists

    # Users (admins only)
    /users:
        get:
            security:
                - bearerAuth: []
            tags:
                - Users
            summary: List all users (admins only)
            responses:
                '200':
                    description: Users, admins first
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/User'
                '401':
                    description: Missing or invalid token
                '403':
                    description: Logged in, but not an admin
        post:
            security:
                - bearerAuth: []
            tags:
                - Users
            summary: Create a user (admins only)
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateUserRequest'
            responses:
                '201':
                    description: User created
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    description: Invalid username, password or role
                '403':
                    description: Logged in, but not an admin
                '409':
                    description: Username already exists

    /users/{userId}:
        parameters:
            - in: path
              name: userId
              required: true
              schema:
                  type: string
              example: f60d0
        patch:
            security:
                - bearerAuth: []
            tags:
                - Users
            summary: Change a user's role (admins only)
            description: You can't change your own role, so there is always at least one admin.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [role]
                            properties:
                                role:
                                    type: string
                                    enum: [admin, employee]
            responses:
                '200':
                    description: User updated
                '400':
                    description: Invalid role, or trying to change your own role
                '403':
                    description: Logged in, but not an admin
                '404':
                    description: User not found
        delete:
            security:
                - bearerAuth: []
            tags:
                - Users
            summary: Delete an employee account (admins only)
            description: Only users with the role `employee` can be deleted, and not yourself. To remove an admin, change the role to employee first. Their token stops working right away.
            responses:
                '200':
                    description: User deleted
                '400':
                    description: Trying to delete your own account
                '403':
                    description: Not an admin, or the user is an admin
                '404':
                    description: User not found
    /wine-list:
        get:
            tags:
                - WineList
            summary: Get all wine lists
            description: Retrieve all wine lists (e.g. red, white, sparkling)
            responses:
                '200':
                    description: Wine lists retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'

    /wine-list/{id}:
        get:
            tags:
                - WineList
            summary: Get wine list by ID
            description: Retrieve a specific wine list (e.g. "red-wines")
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                  example: red-wines
            responses:
                '200':
                    description: Wine list retrieved successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'
                '404':
                    $ref: '#/components/responses/NotFoundError'
        put:
            security:
                - bearerAuth: []
            tags:
                - WineList
            summary: Update entire wine list
            description: Replace all data in a wine list (admin only)
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                  example: red-wines
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                id:
                                    type: string
                                    example: red-wines
                                title:
                                    type: string
                                    example: Rött
                                countries:
                                    type: object
            responses:
                '200':
                    description: Wine list updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /wine-list/{id}/wine:
        post:
            security:
                - bearerAuth: []
            tags:
                - WineList
            summary: Add new wine to wine list
            description: Add a new wine to a wine list. Specify country, optional area, name, and price.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                  example: red-wines
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - country
                                - name
                                - price
                            properties:
                                country:
                                    type: string
                                    example: italy
                                area:
                                    type: string
                                    example: Piemonte
                                name:
                                    type: string
                                    example: Barolo
                                price:
                                    type: number
                                    example: 450
            responses:
                '201':
                    description: Wine added successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'
                '400':
                    $ref: '#/components/responses/BadRequestError'
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /wine-list/{listId}/wine/{wineId}:
        put:
            security:
                - bearerAuth: []
            tags:
                - WineList
            summary: Update wine (name, price, country, area)
            description: Update a wine's name, price, country, or area by its ID.
            parameters:
                - in: path
                  name: listId
                  required: true
                  schema:
                      type: string
                  example: red-wines
                - in: path
                  name: wineId
                  required: true
                  schema:
                      type: string
                  example: wine-1234567890
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                    example: Barolo Superiore
                                price:
                                    type: number
                                    example: 555
                                country:
                                    type: string
                                    example: italy
                                area:
                                    type: string
                                    example: Piemonte
            responses:
                '200':
                    description: Wine updated successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'
                '404':
                    $ref: '#/components/responses/NotFoundError'

        delete:
            security:
                - bearerAuth: []
            tags:
                - WineList
            summary: Delete wine by ID
            description: Delete a wine from a wine list by its ID.
            parameters:
                - in: path
                  name: listId
                  required: true
                  schema:
                      type: string
                  example: red-wines
                - in: path
                  name: wineId
                  required: true
                  schema:
                      type: string
                  example: wine-1234567890
            responses:
                '200':
                    description: Wine deleted successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /wine-list/{listId}/wine/{wineId}/toggle:
        patch:
            security:
                - bearerAuth: []
            tags:
                - WineList
            summary: Toggle active on wine by ID
            description: Toggle the "active" status of a wine by its ID.
            parameters:
                - in: path
                  name: listId
                  required: true
                  schema:
                      type: string
                  example: red-wines
                - in: path
                  name: wineId
                  required: true
                  schema:
                      type: string
                  example: wine-1234567890
            responses:
                '200':
                    description: Wine toggled successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiResponse'
                '404':
                    $ref: '#/components/responses/NotFoundError'

    # Menu PDFs (Meny & Vinlista)
    /menu-pdfs:
        get:
            tags:
                - Menu PDFs
            summary: List uploaded PDFs, newest first
            parameters:
                - in: query
                  name: type
                  required: false
                  schema:
                      type: string
                      enum: ['food', 'wine', 'lunch', 'drinks']
            responses:
                '200':
                    description: List of PDFs (empty list when none)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/MenuPdf'

    /menu-pdfs/upload:
        post:
            security:
                - bearerAuth: []
            tags:
                - Menu PDFs
            summary: Upload a PDF (max 10 MB)
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            type: object
                            required:
                                - file
                                - type
                            properties:
                                file:
                                    type: string
                                    format: binary
                                type:
                                    type: string
                                    enum: ['food', 'wine', 'lunch', 'drinks']
                                title:
                                    type: string
                                    description: Name shown in the admin. Defaults to the file name.
                                activate:
                                    type: boolean
                                    default: false
                                    description: Show it on the website right away
            responses:
                '201':
                    description: PDF uploaded
                '400':
                    description: Missing/invalid file or type
                '401':
                    description: Missing or invalid token
                '413':
                    description: File larger than 10 MB

    /menu-pdfs/active:
        get:
            tags:
                - Menu PDFs
            summary: Get the active PDF for a type
            parameters:
                - in: query
                  name: type
                  required: true
                  schema:
                      type: string
                      enum: ['food', 'wine', 'lunch', 'drinks']
            responses:
                '200':
                    description: The active PDF
                '404':
                    description: No active PDF for this type

    /menu-pdfs/{id}/activate:
        patch:
            security:
                - bearerAuth: []
            tags:
                - Menu PDFs
            summary: Show this PDF on the website (turns off the previous one of the same type)
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: PDF activated
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /menu-pdfs/{id}/deactivate:
        patch:
            security:
                - bearerAuth: []
            tags:
                - Menu PDFs
            summary: Stop showing this PDF (the website falls back to its placeholder PDF)
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: PDF deactivated
                '404':
                    $ref: '#/components/responses/NotFoundError'

    /menu-pdfs/{id}:
        delete:
            security:
                - bearerAuth: []
            tags:
                - Menu PDFs
            summary: Delete a PDF (also removes the file from Cloudinary)
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: PDF deleted
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '502':
                    description: Cloudinary could not delete the file; nothing was removed

    # Site settings (which pages are shown)
    /site-settings:
        get:
            tags:
                - Site
            summary: Which pages are shown in the navbar and on the homepage
            responses:
                '200':
                    description: Current settings (all hidden if never saved)
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/ApiResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/SiteSettings'
        put:
            security:
                - bearerAuth: []
            tags:
                - Site
            summary: Change one or more page switches (only the sent values change)
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                pages:
                                    type: object
                                    additionalProperties:
                                        $ref: '#/components/schemas/PageVisibility'
                        example:
                            pages:
                                chambre: { navbar: true, home: false }
                                events: { home: true }
            responses:
                '200':
                    description: Settings after the update
                '400':
                    $ref: '#/components/responses/BadRequestError'

    /site-config:
        get:
            tags:
                - Site
            summary: Everything the public website needs in one call
            description: Page switches plus the active Meny (food) and Vinlista (wine) PDF. A menu is null when no PDF is active.
            responses:
                '200':
                    description: Site config
                    content:
                        application/json:
                            example:
                                status: 200
                                success: true
                                message: 'Site config retrieved successfully'
                                data:
                                    pages:
                                        chambre: { navbar: true, home: false }
                                        events: { navbar: false, home: false }
                                        gallery: { navbar: false, home: false }
                                    menus:
                                        food:
                                            url: 'https://res.cloudinary.com/<cloud>/image/upload/v1/menu-pdfs/food-1790257463874.pdf'
                                            title: 'Höstmeny 2026'
                                            uploadedAt: '2026-09-24T13:44:23.876Z'
                                        wine: null

    /health:
        get:
            tags:
                - Site
            summary: API and database status
            responses:
                '200':
                    description: API and database are up
                '503':
                    description: API is up but the database is not connected

tags:
    - name: Menus
      description: Menu management operations
    - name: Opening Hours
      description: Restaurant opening hours management
    - name: Events
      description: Event management operations
    - name: Authentication
      description: User authentication operations
    - name: Users
      description: Create users, change roles, delete employees (admins only)
    - name: WineList
      description: Wine list management operations
    - name: Menu PDFs
      description: Meny and Vinlista PDFs shown on the website
    - name: Site
      description: Page switches, site config and health
